{% set version = "0.26.9.14" %}

package:
  name: trash-cli
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/t/trash-cli/trash_cli-{{ version }}.tar.gz
  sha256: dfff726023223a864181e23ab5e349abb6a8e85d5341c0a4abb1c9340ad8764e

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - typing_extensions
    - enum34
    - python >={{ python_min }}
    - psutil
    - six
    # optional fot autocomplete
    - shtab
    - typing

test:
  imports:
    - trashcli
  commands:
    #- pip check
    - trash -h
    - trash-put -h
    - trash-list -h
    - trash-restore -h
    - trash-empty -h
    - trash-rm -h
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/andreafrancia/trash-cli
  license: GPL-2.0-or-later
  license_file: COPYING
  summary: Command line interface to FreeDesktop.org Trash.

extra:
  recipe-maintainers:
    - ocefpaf
